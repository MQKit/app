name: CI

# Every push and pull request: the interface check, the tests, clippy with warnings as
# errors, and cargo-deny (licenses, known vulnerabilities, sources). The
# signed installer is never built here: signing needs the Certum token, on the release PC
# (scripts\package.ps1 -Release). Actions are pinned to commits: a tag can be moved.

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml names the CMake of the release PC's Visual Studio; the runner's
  # own CMake knows its Visual Studio (an existing variable wins over config.toml).
  CMAKE: cmake

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the version in rust-toolchain.toml
      - name: Rust
        run: rustup toolchain install
      - name: Interface
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix ui ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix ui run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # every language complete: plurals, placeholders, the tools' texts
          node scripts/i18n-check.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix ui run build
      # The app bundles the workers and their manifests (src-tauri/resources): built
      # first, in debug, so the app compiles.
      - name: Workers
        run: node scripts/build-workers.mjs
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  deny:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny
        run: |
          # a fixed version: a newer one can change what the check reports
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check

[package]
name = "mqkit"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true

[lib]
name = "mqkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
contract = { path = "../crates/contract" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
# platform-verifier: certificates checked by Windows, which completes a chain a server
# sends incomplete (some LibreOffice download mirrors do), as browsers do.
ureq = { version = "3", features = ["platform-verifier"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
# .tar.bz2 engines (the sherpa-onnx models)
tar = "0.4"
bzip2 = "0.6"
toml = "1"

[target.'cfg(windows)'.dependencies]
# The WebView2 events Tauri leaves alone (the microphone's permission for the recorder);
# the same version Tauri's webview uses.
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
  "Win32_Globalization",
  "Win32_System_WinRT",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Media_Ocr",
  "Media_SpeechSynthesis",
] }

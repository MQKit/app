[workspace]
resolver = "2"
members = ["crates/contract", "crates/hb-subset", "crates/whisper", "crates/worker-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
